<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="icon" type="image/x-icon" href="https://play.luckyladygames.com/favicon.ico">

	<title>LLG Pull Tabs</title>

	<!-- Redirect to test.html when no URL params (config, sessionId, etc.) -->
	<script>
		if ((location.pathname === '/' || location.pathname === '/index.html') && !location.search) {
			location.replace('test.html');
		}
	</script>

	<script type="module">
		// Dynamic page title from selected game config — mirrors LL Scratch index.html behavior
		(async function () {
			function formatConfigTitle(configName) {
				if (!configName) return 'LLG Pull Tabs';

				const words = configName.split(/[-_]/).filter((w) => w.length > 0);
				const formattedWords = words.map((word) => {
					return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
				});

				return formattedWords.join(' ');
			}

			try {
				const { getSelectedConfigName } = await import('./src/config/game/game-config.js');
				document.title = formatConfigTitle(getSelectedConfigName());
			} catch (error) {
				console.warn('Could not load game config for title:', error);
			}
		})();
	</script>

	<script src="https://cdn.jsdelivr.net/npm/phaser@v3.88.2/dist/phaser.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
	
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #242424;
		}
		#game-container {
			width: 100%;
			height: 100%;
			display: block;
		}
		#game-container canvas {
			display: block;
		}
	</style>
</head>

<body>
	<!-- Phaser Game Container -->
	<div id="game-container"></div>

	<!-- Fatal error overlay (production). Handlers in src/bootstrap/runtimeErrorHandlers.js — not Vite. -->
	<div id="error-overlay" style="display:none;position:fixed;inset:0;background:#1a1a1a;color:#ff6b6b;padding:20px;font-family:monospace;font-size:14px;overflow:auto;z-index:99999;">
		<h2 style="color:#ff6b6b;margin-bottom:16px;">Game failed to load</h2>
		<pre id="error-message" style="white-space:pre-wrap;word-break:break-all;"></pre>
		<p style="margin-top:16px;color:#888;">Check console for details. On mobile: use USB debugging or remote inspector.</p>
	</div>

	<!-- JavaScript Files -->
	<script type="module" src="./src/main.js"></script>
</body>

</html>
